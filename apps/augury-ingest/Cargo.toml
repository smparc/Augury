[package]
name = "augury-ingest"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Fault-tolerant X post ingestion with MinHash near-duplicate filtering and a persisted read budget."
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Runtime-checked queries only (`sqlx::query`, never `sqlx::query!`), so the
# crate compiles without a live database to introspect at build time.
# `runtime-tokio` + `tls-rustls` as separate features rather than the combined
# `runtime-tokio-rustls`, which sqlx 0.8 dropped. The split spelling is valid on
# both 0.7 and 0.8.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "test-util"] }

[[bin]]
name = "augury-ingest"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
