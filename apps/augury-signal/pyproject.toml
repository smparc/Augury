[project]
name = "augury-signal"
version = "0.2.0"
description = "Augury signal service: market polling, stance classification, S(t) aggregation, and the reference LMSR/econometrics implementations."
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

# Pinned to <3.13 deliberately: torch/transformers/dagster wheel availability is
# the binding constraint, not anything in this package. `uv venv --python 3.12`.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "statsmodels>=0.14",       # adfuller, VAR lag selection, Granger, BH FDR
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.1",
    "vaderSentiment>=3.3.2",   # lexicon baseline + ensemble disagreement flag
    "rapidfuzz>=3.6",          # alias/misspelling matching for market queries
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "jsonschema>=4.21",        # validates messages against schemas/
]

[project.optional-dependencies]
# Heavy ML stack, separated so the vertical slice and its tests install fast.
nlp = [
    "torch>=2.2",
    "transformers>=4.37",
    "accelerate>=0.27",
    "sentencepiece>=0.2",      # DeBERTa-v3 tokenizer requires this
]
orchestration = [
    "dagster>=1.6",
    "dagster-webserver>=1.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]
viz = [
    "matplotlib>=3.8",
    "seaborn>=0.13.2",
    "jupyter>=1.0",
]

[project.scripts]
augury = "augury_signal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["augury_signal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network-touching tests are opt-in: `pytest -m live`. The default run is
# entirely offline so CI never depends on a venue API being up, and never
# spends X API credit.
markers = [
    "live: hits a real external API (deselected by default)",
    "db: requires a running TimescaleDB (deselected by default)",
]
addopts = "-m 'not live and not db' --strict-markers"

[tool.ruff]
# 110 rather than 88/100: the math modules carry long explanatory comments and
# the golden-vector tables are wide data literals. Reflowing those hurts more
# than it helps.
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
