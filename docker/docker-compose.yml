name: augury

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: augury-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-augury}
      POSTGRES_USER: ${POSTGRES_USER:-augury}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-augury_local_dev}
      # Timescale tuning is left to the image defaults; this is a dev box, not
      # a production deployment.
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-augury} -d ${POSTGRES_DB:-augury}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: augury-redis
    restart: unless-stopped
    # appendonly keeps the last published signal/sim ticks across a restart so
    # a subscriber that reconnects is not staring at an empty stream.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  timescale_data:
  redis_data:
